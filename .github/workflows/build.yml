name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the only OS that can run the ConPTY tests; Linux proves
        # the platform-independent layers still compile and pass.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A ConPTY teardown bug hangs rather than failing; cap the job.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning computes from git height.

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
