name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the only OS that can run the ConPTY tests; Linux proves
        # the platform-independent layers still compile and pass.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A ConPTY teardown bug hangs rather than failing; cap the job.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning computes from git height.

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      # Which pseudoconsole ran: Microsoft's bundled conpty.dll, or the
      # copy built into Windows when the bundled one couldn't start.
      - name: Report the ConPTY backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmux = "src/ConPtyHost.Tmux/bin/Release/net10.0/tmux.exe"
          $socket = Join-Path $env:RUNNER_TEMP "backend.sock"
          & $tmux -S $socket new-session -d -s main cmd.exe
          $backend = & $tmux -S $socket list-panes -t main -F '#{pane_backend}'
          & $tmux -S $socket kill-server
          Get-ChildItem src/ConPtyHost.Tmux/bin/Release/net10.0 -Recurse -Include conpty.dll, OpenConsole.exe | ForEach-Object { "shipped: $($_.FullName)" }
          "pane backend: $backend"

  # Every commit to main is a release: Nerdbank.GitVersioning derives the
  # package version from git height, so each one publishes a new 0.0.N.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Nerdbank.GitVersioning computes from git height.

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: >
          dotnet pack src/ConPtyHost.Core/ConPtyHost.Core.csproj
          --configuration Release
          --output artifacts

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
